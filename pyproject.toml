[project]
name = "moscripts"
version = "0.2.0"
description = "Small Python CLIs packaged with Nix: motmp, mpv_playlists, password_generator, human_timestamp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "andrewthomaslee", email = "andrewthomaslee.business@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.10.1",
    "rich>=13",
    "typer>=0.16.0",
]

[project.scripts]
human_timestamp = "moscripts.human_timestamp:app"
motmp = "moscripts.motmp:app"
mpv_playlists = "moscripts.mpv_playlists:app"
password_generator = "moscripts.password_generator:app"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

