# devenv CLI entry: devenv shell, auto-activation (devenv hook + devenv
# allow), devenv up, devenv test. nixpkgs (and uv2nix, through org-pkgs) come from
# external-systems/pkgs at the rev flake.lock holds (checks.lock-sync; fix
# with `sync-locks`). The input is NOT named `pkgs`: devenv passes every
# input to devenv.nix as a module argument, so an input called `pkgs` would
# replace nixpkgs' pkgs ("attribute 'bash' missing").
inputs:
  org-pkgs:
    url: github:external-systems/pkgs/f6e10719bc5c5eb2b9a4fdba891a4bf36a6a4664
  nixpkgs:
    follows: org-pkgs/nixpkgs
imports:
  # The org shell: fmt, check, sync-locks, docs, slides, vm-test; devenv up
  # serves docs and slides.
  - org-pkgs/devenv
  # The editable uv2nix venv, uv, ruff and ty (flakeModules.python's set).
  - org-pkgs/devenv/python
